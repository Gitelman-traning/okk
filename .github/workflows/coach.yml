name: OKK coach

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Client name (cache key, as in one-off runs)'
        required: true
      url:
        description: 'Zoom share link (empty = only cached transcript)'
        required: false
        default: ''
      passcode:
        description: 'Passcode'
        required: false
        default: ''
      manager:
        description: 'Manager name'
        required: false
        default: ''
      date:
        description: 'Meeting date, dd.mm.yy'
        required: false
        default: ''
      deal:
        description: 'amo deal id'
        required: false
        default: ''
      outcome:
        description: 'Known outcome: комитет / оплата / нет'
        required: false
        default: ''
      models:
        description: 'Models, comma separated'
        required: false
        default: 'anthropic/claude-opus-5-5,anthropic/claude-fable-5-1,openai/gpt-6-astra,openai/gpt-6-sol'
      tab:
        description: 'Sheet tab'
        required: false
        default: 'Коуч'

jobs:
  coach:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Cache key
        id: key
        run: echo "name=transcript-$(printf '%s' "${{ inputs.client }}" | md5sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Fetch cached transcript
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=${{ steps.key.outputs.name }}&per_page=1" --jq '.artifacts[0].id')
          if [ -n "$id" ] && [ "$id" != "null" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > cache.zip
            mkdir -p cache && unzip -o -q cache.zip -d cache && echo "cache found: artifact $id"
          else
            echo "no cached transcript, will transcribe"
          fi
      - run: python coach.py
        env:
          REC_CACHE: cache/transcript.json
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          CHECKLIST_JSON: ${{ secrets.CHECKLIST_JSON }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          DEEPGRAM_TOKEN: ${{ secrets.DEEPGRAM_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PRICES_JSON: ${{ secrets.LLM_PRICES_JSON }}
          LLM_EXTRA_JSON: ${{ secrets.LLM_EXTRA_JSON }}
          REC_URL: ${{ inputs.url }}
          REC_PASSCODE: ${{ inputs.passcode }}
          REC_CLIENT: ${{ inputs.client }}
          REC_MANAGER: ${{ inputs.manager }}
          REC_DATE: ${{ inputs.date }}
          REC_DEAL: ${{ inputs.deal }}
          REC_OUTCOME: ${{ inputs.outcome }}
          COACH_MODELS: ${{ inputs.models }}
          COACH_TAB: ${{ inputs.tab }}
      - name: Keep transcript for next runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.key.outputs.name }}
          path: cache/transcript.json
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true
